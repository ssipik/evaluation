[project]
name = "rag-evaluation"
version = "0.1.0"
description = "Evaluation module: golden set, retrieval and judge scoring, parameter sweeps (ARCHITECTURE.md block 12)"
requires-python = ">=3.13"
dependencies = [
    "PyYAML>=6.0",
    # The query path under test. Tier 1 imports Retriever directly and never
    # touches the LLM; tier 2 runs the whole agent.
    "rag-agent",
    # Parameters and the ingest fingerprint that names a sweep's collection.
    "rag-config",
    # The full platform, not mlflow-skinny: this module runs
    # mlflow.genai.evaluate() and its judge scorers, which skinny does not ship
    # in a usable form. Production stays on skinny — see agent/pyproject.toml.
    "mlflow>=3.15",
    # The judge transport. MLflow dispatches a model URI like
    # `openrouter:/openai/gpt-5.4` through litellm, and does not depend on it
    # itself, so an absent litellm shows up as a judge that cannot be reached.
    "litellm>=1.97",
    # `generate` reads the ledger to sample documents — the one place this
    # module touches Postgres. Core + text(), not the stages' table mirrors: it
    # only ever runs one read-only select.
    # `curve` draws metric-vs-parameter plots and logs them as MLflow artifacts.
    # seaborn for the drawing, matplotlib because it owns the Figure that
    # mlflow.log_figure takes; mlflow already pulls matplotlib in, but this
    # module imports it directly so it is pinned here too.
    # The golden set is logged as an MLflow dataset input, whose digest says
    # which set a score belongs to; from_pandas is the only frame MLflow takes.
    "pandas>=2.0",
    "seaborn>=0.13",
    "matplotlib>=3.8",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.2",
    # `generate`'s transport. Direct rather than through rag-agent's build_llm,
    # because the point is a model from a third family with its own settings —
    # see generate.py.
    "openai>=2.0",
    # `search` drives the TPE sampler and its SQLite study storage. Only the
    # core: the plots come from optuna.visualization.matplotlib, which needs
    # nothing beyond matplotlib, already pinned above.
    "optuna>=4.0",
    # `aggregate` compares every summary point with every other, which is one
    # matrix product rather than 48k Python calls — see _similarity_matrix.
    # Arrives transitively through mlflow and llama-index anyway; declared
    # because this module imports it directly.
    "numpy>=2.0",
    "jupyter>=1.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# rag-agent is a path dependency, so uv also reads its [tool.uv.sources], which
# pins rag-config to the bitbucket repo. That URL and the path source below are
# two different sources for one package, which uv refuses to resolve. A bare
# override drops the URL from every requirement for rag-config; the path source
# then decides where it comes from.
override-dependencies = ["rag-config"]

[tool.uv.sources]
# The branch, not the working tree: a sweep must measure a config that is
# committed and pushed, or the parameters behind a score cannot be recovered
# later. Which commit of that branch is recorded in uv.lock — `uv lock` moves
# it, `uv sync` installs whatever it says.
rag-config = { git = "https://bitbucket.org/get-capital/config.git", rev = "main" }
# rag-agent stays a path source: it is the query path under test, and this
# module is never built into an image, so it reaches its sibling by path the way
# it already shells out to the stage entrypoints (see stages.py).
rag-agent = { path = "../agent", editable = true }
