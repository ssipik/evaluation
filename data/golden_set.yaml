# The questions below are SEEDED from what is actually in the corpus — every one
# has matching documents today. 
# You can run the harness before filling any of them in:
#   - faithfulness and answer_relevancy need no reference and score immediately
#   - context_recall and context_precision are skipped per entry until `reference`
#     is non-empty
# So fill them in gradually; the harness reports how many of each it could score.
#
# Target is ~50-100 entries (block 12). This is a starting scaffold, deliberately
# spread across every source_system, both languages, and the query shapes that
# stress different retrieval legs:
#   - exact identifiers and figures  -> the BM25 legs
#   - paraphrase and synonym         -> the dense leg
#   - German compounds               -> the known sparse gap (block 5)
#
# Fields:
#   id         stable slug, so a score can be tracked across runs
#   question   what gets asked
#   language   de | en (of the QUESTION; the corpus is mixed and the answer may
#              legitimately come from a document in the other language)
#   reference  the correct answer, in your words. Empty = not yet written.
#              Read by tier 2 (the judge scorers).
#   relevant_documents
#              the documents retrieval MUST return for this question, each one a
#              `source_system` + `url` pair — the url alone does not identify a
#              document, since two sources can list the same url.
#              Read by tier 1. Empty = not yet labeled, and the entry is skipped
#              rather than scored as a miss. Fill these in with `pool`, which
#              runs the retriever at k=20 across several configurations and
#              prints what came back — you pick the correct ones from its output
#              rather than reading the corpus (this is pooling; see
#              EVALUATION.md). Labels are DOCUMENTS, not chunk ids: chunk ids
#              regenerate on every re-chunk, and chunk size is the parameter a
#              sweep most wants to vary.
#   expect_refusal
#              true when the correct behaviour is to refuse. Read by tier 3.
#   tests      free-text note on what this entry is meant to stress
